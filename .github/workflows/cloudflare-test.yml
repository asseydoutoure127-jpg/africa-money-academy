name: Essai Cloudflare

# Construit le site pour Cloudflare à chaque envoi sur la branche d'essai.
# Le déploiement ne part que si les secrets Cloudflare existent (voir docs/MIGRATION_CLOUDFLARE.md).
on:
  push:
    branches: [cloudflare-test]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - name: Construire pour Cloudflare
        run: npx opennextjs-cloudflare build
      - name: Déployer (seulement si les secrets existent)
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          npx wrangler deploy --var SITE_URL:${{ vars.CF_SITE_URL }}
          echo "${{ secrets.DATABASE_URL }}" | npx wrangler secret put DATABASE_URL
