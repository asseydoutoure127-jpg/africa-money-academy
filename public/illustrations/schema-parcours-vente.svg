<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 890 250" role="img" aria-label="Les cinq étapes d’une vente sur WhatsApp"><rect width="890" height="250" rx="20" fill="#fff" stroke="#dde1ee"/><rect x="30" y="60" width="150" height="150" rx="18" fill="#1b2a5c"/><circle cx="105" cy="62" r="22" fill="#f2a900"/><text x="105" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#1b2a5c">1</text><text x="105" y="125" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Le client voit</text><text x="105" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#fff" opacity=".85">votre statut</text><path d="M182 135h16m-6 -7 7 7-7 7" stroke="#f2a900" stroke-width="3" fill="none"/><rect x="202" y="60" width="150" height="150" rx="18" fill="#0f1838"/><circle cx="277" cy="62" r="22" fill="#f2a900"/><text x="277" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#1b2a5c">2</text><text x="277" y="125" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Il vous écrit</text><text x="277" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#fff" opacity=".85">vous répondez vite</text><path d="M354 135h16m-6 -7 7 7-7 7" stroke="#f2a900" stroke-width="3" fill="none"/><rect x="374" y="60" width="150" height="150" rx="18" fill="#1b2a5c"/><circle cx="449" cy="62" r="22" fill="#f2a900"/><text x="449" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#1b2a5c">3</text><text x="449" y="125" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Vous donnez</text><text x="449" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#fff" opacity=".85">prix + livraison</text><path d="M526 135h16m-6 -7 7 7-7 7" stroke="#f2a900" stroke-width="3" fill="none"/><rect x="546" y="60" width="150" height="150" rx="18" fill="#0f1838"/><circle cx="621" cy="62" r="22" fill="#f2a900"/><text x="621" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#1b2a5c">4</text><text x="621" y="125" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Il commande</text><text x="621" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#fff" opacity=".85">et paie</text><path d="M698 135h16m-6 -7 7 7-7 7" stroke="#f2a900" stroke-width="3" fill="none"/><rect x="718" y="60" width="150" height="150" rx="18" fill="#1b2a5c"/><circle cx="793" cy="62" r="22" fill="#f2a900"/><text x="793" y="70" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="22" font-weight="800" fill="#1b2a5c">5</text><text x="793" y="125" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="19" font-weight="700" fill="#fff">Vous livrez</text><text x="793" y="152" text-anchor="middle" font-family="system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif" font-size="15" fill="#fff" opacity=".85">puis vous notez</text><g transform="translate(838 198) scale(0.6)"><rect width="64" height="64" rx="16" fill="#1b2a5c"/><path d="M32 8 56 32 32 56 8 32Z" fill="#f2a900"/><path d="M32 20 44 32 32 44 20 32Z" fill="#1b2a5c"/><circle cx="32" cy="32" r="4.5" fill="#f2a900"/></g></svg>